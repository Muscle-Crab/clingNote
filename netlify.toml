[build]
publish = "dist"  # or "build" if using Vite or React
functions = "netlify/functions"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
node_bundler = "esbuild"

[functions."stripe-webhook"]
included_files = ["netlify/functions/serviceAccountKey.json"]
external_node_modules = ["stripe", "firebase-admin", "@opentelemetry/api"]

[functions."daily-report"]
schedule = "@hourly"
external_node_modules = ["firebase-admin"]

[functions."calendar"]
external_node_modules = ["firebase-admin"]

[functions."send-notification"]
external_node_modules = ["firebase-admin"]

# Explicitly allow microphone (voice input) for our own origin
[[headers]]
for = "/*"
[headers.values]
Permissions-Policy = "microphone=(self), camera=()"
