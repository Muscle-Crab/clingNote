<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <title><%= htmlWebpackPlugin.options.title %></title>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"></script>

    <script>
        console.log("This is a test log. If you see this, console logging is working.");

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            console.log("Inside OneSignal Deferred function");

            if (!OneSignal) {
                console.error("OneSignal is not available inside Deferred function!");
                return;
            }

            console.log("Before OneSignal Initialization");

            try {
                await OneSignal.init({
                    appId: "fc206a71-7d65-4cfa-b8b2-0c10548e1476",
                    safari_web_id: "web.onesignal.auto.2068edc0-2ec7-4d8d-bc37-83913e3acbff",
                    notifyButton: {
                        enable: true,
                    },
                });

                console.log("OneSignal Initialized");
            } catch (error) {
                console.error("OneSignal init failed:", error);
            }

            // Check subscription status
            const isSubscribed = await OneSignal.isPushNotificationsEnabled();
            console.log("User is subscribed:", isSubscribed);

            if (isSubscribed) {
                const playerId = await OneSignal.getUserId();
                console.log("OneSignal Player ID:", playerId);
            } else {
                console.log("User has not subscribed to notifications.");
            }
        });

        console.log("Script executed, waiting for OneSignal...");
    </script>




</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>

<!-- built files will be auto injected -->
</body>
</html>
