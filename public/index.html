<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <title><%= htmlWebpackPlugin.options.title %></title>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            alert("Checking for OneSignal ID..."); // Immediate pop-up when the page loads

            console.log("Initializing OneSignal...");

            await OneSignal.init({
                appId: "fc206a71-7d65-4cfa-b8b2-0c10548e1476",
                safari_web_id: "web.onesignal.auto.2068edc0-2ec7-4d8d-bc37-83913e3acbff",
                notifyButton: {
                    enable: true,
                },
            });

            console.log("OneSignal initialized!");

            // Function to continuously check for the OneSignal Player ID
            async function checkUserId(retries = 10) {
                for (let i = 0; i < retries; i++) {
                    const userId = await OneSignal.getUserId();

                    console.log(`Attempt ${i + 1}: OneSignal User ID:`, userId);

                    if (userId) {
                        alert("OneSignal ID found: " + userId);
                        console.log("OneSignal ID found:", userId);
                        return;
                    }

                    await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second before retrying
                }

                alert("No OneSignal ID found. User may not be subscribed yet.");
                console.log("No OneSignal ID found after retries.");
            }

            checkUserId(); // Start checking for the Player ID
        });
    </script>





</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>

<!-- built files will be auto injected -->
</body>
</html>
